name: AWS Health AI CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      AGENTCORE_HARNESS_ARN: ${{ secrets.AGENTCORE_HARNESS_ARN }}
      GUARDRAIL_ID: ${{ secrets.GUARDRAIL_ID }}
      GUARDRAIL_VERSION: DRAFT
      OPENSEARCH_ENDPOINT: ${{ secrets.OPENSEARCH_ENDPOINT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate Python imports
        run: |
          python -m compileall app rag evaluation
          
      - name: Show OIDC subject
        shell: bash
        run: |
          TOKEN_RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$TOKEN_RESPONSE" | python -c \
            "import sys,json; print(json.load(sys.stdin)['value'])")

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2)

          python - "$PAYLOAD" <<'PY'
          import sys, json, base64

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload).decode()
          )

          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_CI_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run tests
        run: |
          pytest -v

      - name: Run evaluation
        run: |
          python -m evaluation.evaluate

